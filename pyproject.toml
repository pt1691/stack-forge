[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "stack-forge-infra"
dynamic = ["version"]
description = "Self-Service Infrastructure Templating Engine for Terraform & Terragrunt"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Praneeth Turlapati", email = "praneeth1691@gmail.com" }
]
keywords = [
    "terraform",
    "terragrunt",
    "infrastructure-as-code",
    "iac",
    "aws",
    "devops",
    "automation",
    "templates",
    "cli"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "jinja2>=3.0.0",
    "pyyaml>=6.0.0",
    "python-hcl2>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "hatch-vcs>=0.4.0",
]

[project.scripts]
forge = "stack_forge.cli:app"

[project.urls]
Homepage = "https://github.com/pt1691/stack-forge"
Repository = "https://github.com/pt1691/stack-forge"
Issues = "https://github.com/pt1691/stack-forge/issues"

[tool.hatch.version]
source = "vcs"
tag-pattern = "v(?P<version>[^+]+)"

[tool.hatch.build.hooks.vcs]
version-file = "src/stack_forge/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/stack_forge"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["B008", "B904"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=stack_forge"
