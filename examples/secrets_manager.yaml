# Secrets Manager Example
# Creates secrets with optional rotation and cross-region replication

version: "1.0"
name: secrets-manager-example
organization: mycompany
default_provider: aws
default_region: us-west-2
environments:
  - dev

stacks:
  - name: secrets
    description: Application secrets
    environment: dev
    region: us-west-2
    use_terragrunt: true
    resources:
      # Database credentials secret
      - name: db-credentials
        type: secrets_manager
        variables:
          secret_path: "database/credentials"
          description: "Database connection credentials"
          recovery_window_in_days: 30
          enable_rotation: false
          # Set enable_rotation to true and provide rotation_lambda_arn
          # to enable automatic credential rotation

      # API keys with rotation enabled
      - name: api-keys
        type: secrets_manager
        variables:
          secret_path: "api/keys"
          description: "Third-party API keys"
          recovery_window_in_days: 7
          enable_rotation: true
          rotation_days: 90
          # rotation_lambda_arn: pass the ARN of your rotation Lambda at apply time

      # Shared secret replicated to another region
      - name: shared-config
        type: secrets_manager
        variables:
          secret_path: "shared/config"
          description: "Shared configuration across regions"
          recovery_window_in_days: 30
          enable_rotation: false
          # Add replica_regions at apply time, e.g.:
          # replica_regions = [{ region = "us-east-1" }]
