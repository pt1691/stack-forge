# DynamoDB Example
# Creates a DynamoDB table with auto-scaling and point-in-time recovery

version: "1.0"
name: dynamodb-example
organization: mycompany
default_provider: aws
default_region: us-west-2
environments:
  - dev

stacks:
  - name: data
    description: NoSQL data stores
    environment: dev
    region: us-west-2
    use_terragrunt: true
    resources:
      # On-demand (pay-per-request) table — simplest option
      - name: user-sessions
        type: dynamodb
        variables:
          billing_mode: "PAY_PER_REQUEST"
          hash_key: "session_id"
          hash_key_type: "S"
          ttl_attribute_name: "expires_at"
          point_in_time_recovery_enabled: true

      # Provisioned table with auto-scaling and a sort key
      - name: order-events
        type: dynamodb
        variables:
          billing_mode: "PROVISIONED"
          hash_key: "order_id"
          hash_key_type: "S"
          range_key: "event_timestamp"
          range_key_type: "N"
          read_capacity: 10
          write_capacity: 10
          enable_autoscaling: true
          autoscaling_read_max_capacity: 200
          autoscaling_write_max_capacity: 200
          autoscaling_target_value: 70
          stream_enabled: true
          stream_view_type: "NEW_AND_OLD_IMAGES"
          point_in_time_recovery_enabled: true
